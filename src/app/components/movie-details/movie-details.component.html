<mat-card *ngIf="movie">
  <img mat-card-image [src]="movie.image" [alt]="movie.title" />

  <mat-card-title>{{ movie.title }}</mat-card-title>

  <mat-card-content>
    <p><strong>Genre:</strong> {{ movie.genre }}</p>
    <p><strong>Duration:</strong> {{ movie.duration }} mins</p>
    <p><strong>Ratings:</strong> {{ movie.rating }}/10</p>
    <p><strong>Showtime:</strong> {{ movie.showtime | date:'short' }}</p>
  </mat-card-content>

  <mat-card-actions>
    <a [routerLink]="['/movies', movie.id, 'book']">
      <button mat-raised-button color="primary">Book Tickets</button>
    </a>
  </mat-card-actions>
</mat-card>
