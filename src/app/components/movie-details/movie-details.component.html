<div class="movie-detail-card" *ngIf="movie">
  <img [src]="movie.image" [alt]="movie.title">

  <div class="movie-detail-content">
    <h2>{{ movie.title }}</h2>
    <p><strong>Genre:</strong> {{ movie.genre }}</p>
    <p><strong>Duration:</strong> {{ movie.duration }} mins</p>
    <p><strong>Rating:</strong> ⭐ {{ movie.rating }}/10</p>
    <p><strong>Language:</strong> {{ movie.language }}</p>
    <p><strong>Theater:</strong> {{ movie.theater }}</p>
    <p><strong>Location:</strong> {{ movie.location }}</p>
    <p><strong>Showtime:</strong> {{ movie.showtime | date: 'short' }}</p>
  </div>

  <div class="movie-detail-actions">
    <a [routerLink]="['/movies', movie.id, 'book']">
      <button>Book Tickets</button>
    </a>
  </div>
</div>
